<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시장 심리 지표 - Trading Journal</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Design System -->
    <link rel="stylesheet" href="css/design-system.css">
    <!-- Theme init (FOUC 방지) -->
    <script>(function(){var t=null;try{t=localStorage.getItem('trading-journal-theme')}catch(e){}if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);})();</script>
    <style>
        .sentiment-gauge {
            height: 10px;
            border-radius: 999px;
            background: linear-gradient(90deg, #22c55e 0%, #a3e635 25%, #94a3b8 50%, #fbbf24 75%, #ef4444 100%);
            position: relative;
        }
        .sentiment-gauge-marker {
            position: absolute;
            top: -5px;
            width: 4px;
            height: 20px;
            border-radius: 2px;
            background: var(--text-primary);
            transform: translateX(-2px);
            transition: left 0.4s ease;
        }
        .indicator-card {
            border-left: 4px solid var(--text-muted);
        }
    </style>
</head>
<body>
    <!-- Background Orbs -->

    <!-- Main Content -->
    <main class="main-container">
        <!-- Page Header -->
        <header class="page-header fade-in">
            <div class="page-title">
                <h1><i class="bi bi-thermometer-half"></i> 시장 심리 지표</h1>
                <span class="subtitle">공개 지표를 기록하면 제공처 기준 임계값으로 공포/탐욕 구간을 자동 판정합니다</span>
            </div>
        </header>

        <!-- Composite Gauge -->
        <section class="glass-card mb-8 fade-in stagger-1">
            <div class="glass-card-header">
                <h3><i class="bi bi-speedometer2"></i> 종합 심리</h3>
            </div>
            <div class="glass-card-body">
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-6); margin-bottom: var(--space-6);">
                    <div>
                        <label style="color: var(--text-muted); font-size: var(--font-size-xs);">종합</label>
                        <div class="value" id="overall-zone" style="font-size: var(--font-size-2xl); font-weight: 700;">-</div>
                        <div id="overall-action" style="color: var(--text-secondary); font-size: var(--font-size-sm);"></div>
                    </div>
                    <div>
                        <label style="color: var(--text-muted); font-size: var(--font-size-xs);">미국 주식</label>
                        <div class="value" id="us-zone" style="font-size: var(--font-size-xl); font-weight: 600;">-</div>
                    </div>
                    <div>
                        <label style="color: var(--text-muted); font-size: var(--font-size-xs);">암호화폐</label>
                        <div class="value" id="crypto-zone" style="font-size: var(--font-size-xl); font-weight: 600;">-</div>
                    </div>
                </div>
                <div class="sentiment-gauge">
                    <div class="sentiment-gauge-marker" id="gauge-marker" style="left: 50%;"></div>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: var(--space-2); color: var(--text-muted); font-size: var(--font-size-xs);">
                    <span>극단적 공포</span>
                    <span>중립</span>
                    <span>극단적 탐욕</span>
                </div>
                <div id="coverage-warning" class="mt-4" style="color: var(--color-warning); font-size: var(--font-size-sm);"></div>
            </div>
        </section>

        <!-- Record Form -->
        <section class="glass-card mb-8 fade-in stagger-2">
            <div class="glass-card-header">
                <h3><i class="bi bi-pencil-square"></i> 지표 기록</h3>
                <span class="subtitle" style="font-size: var(--font-size-xs); color: var(--text-muted);">같은 지표를 같은 날 다시 기록하면 덮어씁니다</span>
            </div>
            <div class="glass-card-body">
                <form id="sentiment-form">
                    <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 2fr auto; gap: var(--space-4); align-items: end;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label" for="sentiment-indicator">지표 *</label>
                            <select class="form-input" id="sentiment-indicator" required></select>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label" for="sentiment-value">값 * <span id="unit-hint" style="color: var(--text-muted);"></span></label>
                            <input type="number" class="form-input" id="sentiment-value" step="0.0001" required>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label" for="sentiment-date">일자</label>
                            <input type="date" class="form-input" id="sentiment-date">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label" for="sentiment-notes">메모</label>
                            <input type="text" class="form-input" id="sentiment-notes" placeholder="관찰 맥락">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <button type="submit" class="btn-glass primary">
                                <i class="bi bi-plus-lg"></i>기록
                            </button>
                        </div>
                    </div>
                    <div id="indicator-hint" class="mt-4" style="color: var(--text-secondary); font-size: var(--font-size-sm);"></div>
                </form>
            </div>
        </section>

        <!-- Indicator Cards -->
        <section class="mb-8 fade-in stagger-3">
            <h3 style="margin-bottom: var(--space-4);"><i class="bi bi-flag"></i> 미국 주식</h3>
            <div id="us-indicators" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-4);"></div>
        </section>

        <section class="mb-8 fade-in stagger-4">
            <h3 style="margin-bottom: var(--space-4);"><i class="bi bi-currency-bitcoin"></i> 암호화폐</h3>
            <div id="crypto-indicators" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-4);"></div>
        </section>

        <!-- History -->
        <section class="glass-card fade-in stagger-5">
            <div class="glass-card-header">
                <h3><i class="bi bi-clock-history"></i> 기록 이력</h3>
            </div>
            <div class="glass-card-body">
                <div class="table-responsive">
                    <table class="glass-table">
                        <thead>
                            <tr>
                                <th>일자</th>
                                <th>지표</th>
                                <th class="text-right">값</th>
                                <th>판정</th>
                                <th>메모</th>
                                <th>작업</th>
                            </tr>
                        </thead>
                        <tbody id="sentiment-history">
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/navigation.js"></script>
    <script src="sentiment.js"></script>
</body>
</html>
