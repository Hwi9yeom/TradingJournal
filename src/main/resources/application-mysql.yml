# =============================================================================
# application-mysql.yml
# -----------------------------------------------------------------------------
# Dedicated profile for connecting to a local/standalone MySQL 8.0 instance.
# Activate explicitly with: --spring.profiles.active=mysql
#
# This profile inherits everything else (server, logging, Redis, cache, ...)
# from application.yml and only overrides the datasource / JPA / Flyway / H2
# settings that differ for MySQL. Flyway is DISABLED here: the schema is owned
# entirely by src/main/resources/db/mysql/schema-mysql.sql (single source of
# truth). Hibernate runs in `validate` mode so any schema/entity drift fails
# loudly at startup.
#
# Default/test/prod profiles are unaffected.
# =============================================================================
spring:
  datasource:
    # sslMode defaults to PREFERRED (encrypt when the server supports TLS — the
    # mysql:8.0 image does by default), so traffic is NOT cleartext out of the box.
    # allowPublicKeyRetrieval is intentionally NOT enabled (it allows an RSA-key
    # MITM against caching_sha2_password over an unverified channel). For a
    # hardened deployment set DB_SSL_MODE=VERIFY_IDENTITY (and provide a truststore).
    url: ${DB_URL:jdbc:mysql://localhost:3306/tradingjournal?sslMode=${DB_SSL_MODE:PREFERRED}&serverTimezone=UTC&characterEncoding=utf8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:tradingjournal}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      # Keep below the MySQL server wait_timeout so the pool never hands out a
      # connection the server has already closed (avoids "communications link failure").
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: false

  h2:
    console:
      enabled: false
